<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
<div th:insert="admin_navbar::admin_navbar"></div>

<div class="content">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Danh sách Review</h2>
        </div>
        <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/admin/reviews(page=${currentPage - 1}, sortBy=${sortBy}, sortDir=${sortDir})}">Previous</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${i == currentPage ? 'active' : ''}">
                    <a class="page-link" th:href="@{/admin/reviews(page=${i}, sortBy=${sortBy}, sortDir=${sortDir})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/admin/reviews(page=${currentPage + 1}, sortBy=${sortBy}, sortDir=${sortDir})}">Next</a>
                </li>
            </ul>
        </nav>
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>STT</th>
                <th>
                    Tên
                    <a th:href="@{/admin/reviews(page=${currentPage}, sortBy='username', sortDir=${sortDir == 'asc' ? 'desc' : 'asc'})}">
                        <i class="fas fa-sort" th:classappend="${sortBy == 'username' ? (sortDir == 'asc' ? 'fa-sort-up' : 'fa-sort-down') : ''}"></i>
                    </a>
                </th>
                <th>
                    Game
                    <a th:href="@{/admin/reviews(page=${currentPage}, sortBy='gameName', sortDir=${sortDir == 'asc' ? 'desc' : 'asc'})}">
                        <i class="fas fa-sort" th:classappend="${sortBy == 'gameName' ? (sortDir == 'asc' ? 'fa-sort-up' : 'fa-sort-down') : ''}"></i>
                    </a>
                </th>
                <th>Platform</th>
                <th>Gameplay</th>
                <th>Music</th>
                <th>Graphic</th>
                <th>Story</th>
                <th>
                    Điểm trung bình
                    <a th:href="@{/admin/reviews(page=${currentPage}, sortBy='rating', sortDir=${sortDir == 'asc' ? 'desc' : 'asc'})}">
                        <i class="fas fa-sort" th:classappend="${sortBy == 'rating' ? (sortDir == 'asc' ? 'fa-sort-up' : 'fa-sort-down') : ''}"></i>
                    </a>
                </th>
                <th>Nội dung bình luận</th>
                <th>Ngày bình luận</th>
                <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="review, iterStat : ${reviews}">
                <td th:text="${iterStat.count + (currentPage * 10)}"></td>
                <td th:text="${review.username}"></td>
                <td th:text="${review.gameName}"></td>
                <td th:text="${review.platform}"></td>
                <td th:text="${review.gameplay_rating}"></td>
                <td th:text="${review.music_rating}"></td>
                <td th:text="${review.graphic_rating}"></td>
                <td th:text="${review.story_rating}"></td>
                <td th:text="${review.rating}"></td>
                <td th:text="${review.comment}"></td>
                <td th:text="${review.reviewDate}"></td>
                <td>
                    <form th:action="@{/admin/reviews/delete/{id}(id=${review.review_id})}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">Xóa</button>
                    </form>

                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
