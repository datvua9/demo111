
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">


<div th:fragment="navbar">
    <nav class="top-nav">
        <img th:src="@{/img/alec.png}" alt="Logo">
        <div class="right-menu">
            <nav role="navigation" class="primary-navigation">
                <ul>
                    <li th:block sec:authorize="isAnonymous()">
                        <a th:href="@{/login}">Login</a>
                    </li>
                    <li th:block sec:authorize="isAuthenticated()">
                        <a th:href="@{/profile}">   Welcome, <span th:text="${#authentication.name}"></span></a>
                    </li>
                    <li th:block sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="review-submit" >Logout</button>
                        </form>
                    </li>

                </ul>
            </nav>
        </div>
    </nav>
    <nav class="sidebar">
        <div class="search-container">
            <input placeholder="Search" type="search" class="input" id="searchInput">
            <div id="searchResults" class="search-results">
                <div class="games-results">
                    <h3>Games</h3>
                    <ul id="gamesResultsList"></ul>
                </div>
                <div class="news-results">
                    <h3>News</h3>
                    <ul id="newsResultsList"></ul>
                </div>
            </div>
        </div>
        <ul>
            <li><a th:href="@{/home}">Home</a></li>
            <li><a th:href="@{/news}">News</a></li>
            <li><a th:href="@{/game_list}">Games</a></li>
        </ul>
    </nav>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('searchInput');
            const searchResults = document.getElementById('searchResults');
            const gamesResultsList = document.getElementById('gamesResultsList');
            const newsResultsList = document.getElementById('newsResultsList');

            // Hide search results initially
            searchResults.style.display = 'none';

            // Add event listener for input changes
            searchInput.addEventListener('input', function() {
                const query = this.value.trim();

                if (query.length < 2) {
                    searchResults.style.display = 'none';
                    return;
                }

                // Fetch search suggestions
                fetch(`/search/suggestions?query=${encodeURIComponent(query)}`)
                    .then(response => response.json())
                    .then(data => {
                        // Clear previous results
                        gamesResultsList.innerHTML = '';
                        newsResultsList.innerHTML = '';

                        // Add game results
                        if (data.games && data.games.length > 0) {
                            data.games.forEach(game => {
                                const li = document.createElement('li');
                                const a = document.createElement('a');
                                a.href = `/game/${game.gameId}`;
                                a.textContent = game.name;
                                li.appendChild(a);
                                gamesResultsList.appendChild(li);
                            });
                        } else {
                            const li = document.createElement('li');
                            li.textContent = 'No games found';
                            gamesResultsList.appendChild(li);
                        }

                        // Add news results
                        if (data.news && data.news.length > 0) {
                            data.news.forEach(news => {
                                const li = document.createElement('li');
                                const a = document.createElement('a');
                                a.href = `/news/${news.newsId}`;
                                a.textContent = news.title;
                                li.appendChild(a);
                                newsResultsList.appendChild(li);
                            });
                        } else {
                            const li = document.createElement('li');
                            li.textContent = 'No news found';
                            newsResultsList.appendChild(li);
                        }

                        // Show search results
                        searchResults.style.display = 'block';
                    })
                    .catch(error => {
                        console.error('Error fetching search results:', error);
                    });
            });

            // Hide search results when clicking outside
            document.addEventListener('click', function(event) {
                if (!searchInput.contains(event.target) && !searchResults.contains(event.target)) {
                    searchResults.style.display = 'none';
                }
            });
        });
    </script>

    <style>
        .search-container {
            position: relative;
        }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            max-height: 400px;
            overflow-y: auto;
        }

        .games-results, .news-results {
            padding: 10px;
        }

        .games-results {
            border-bottom: 1px solid #eee;
        }

        .search-results h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #666;
        }

        .search-results ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .search-results li {
            padding: 5px 0;
        }

        .search-results a {
            text-decoration: none;
            color: #333;
            display: block;
            padding: 5px;
        }

        .search-results a:hover {
            background-color: #f5f5f5;
        }
    </style>
</div>

</html>
