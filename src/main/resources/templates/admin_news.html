<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
<div th:fragment="navbar" class="sidebar" id="sidebar">
    <nav class="nav flex-column">
        <a class="nav-link" th:href="@{/admin}">
            <i class="fas fa-gamepad"></i>
            <span class="nav-text">Game</span>
        </a>
        <a class="nav-link" th:href="@{/admin/news}">
            <i class="fas fa-newspaper"></i>
            <span class="nav-text">News</span>
        </a>
        <a class="nav-link" th:href="@{/admin/reviews}">
            <i class="fas fa-star"></i>
            <span class="nav-text">Review</span>
        </a>
        <a class="nav-link" th:href="@{/game/comments}">
            <i class="fas fa-comment"></i>
            <span class="nav-text">Comment</span>
        </a>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="nav-link logout-btn">
                <i class="fas fa-sign-out-alt"></i>
                <span class="nav-text">Logout</span>
            </button>
        </form>
    </nav>
</div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Danh sách News</h2>
        <button class="btn btn-primary" data-toggle="modal" data-target="#addNewsModal">Thêm mới News</button>
    </div>
    <nav aria-label="Page navigation">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/admin/news(page=${currentPage - 1})}">Previous</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage ? 'active' : ''}">
                <a class="page-link" th:href="@{/admin/news(page=${i})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/admin/news(page=${currentPage + 1})}">Next</a>
            </li>
        </ul>
    </nav>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>STT</th>
            <th>Đề mục</th>
            <th>Nội dung</th>
            <th>Ngày viết</th>
            <th>Ảnh</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="news, iterStat : ${news}">
            <td th:text="${iterStat.count + (currentPage * 4)}"></td>
            <td th:text="${news.title}"></td>
            <td th:text="${news.content}"></td>
            <td th:text="${news.created_at}"></td>
            <td><img th:src="${news.image}" width="100" alt="Game Image" th:unless="${news.image == null}"/></td>
            <td>
                <a th:href="@{/admin/news/edit/{id}(id=${news.newsId})}" class="btn btn-sm btn-warning">Sửa</a>
                <form th:action="@{/admin/news/delete/{id}(id=${news.newsId})}" method="post" style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">Xóa</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Modal Thêm Game -->
<div class="modal fade" id="addNewsModal" tabindex="-1" role="dialog" aria-labelledby="addNewsModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addNewsModalLabel">Thêm mới News</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">×</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="addNewsForm" th:action="@{/admin/news/add}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="form-group">
                        <label for="title">Đề mục</label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>
                    <div class="form-group">
                        <label for="content">Nội dung</label>
                        <textarea class="form-control" id="content" name="content" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="created_at">Ngày viết</label>
                        <input type="date" class="form-control" id="created_at" name="created_at" required>
                    </div>
                    <div class="form-group">
                        <label for="newsImage">Ảnh (URL)</label>
                        <input type="url" class="form-control" id="newsImage" name="image" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Lưu</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
    $(document).ready(function() {
        $("#addNewsForm").on("submit", function(event) {
            event.preventDefault(); // Ngăn reload mặc định
            $.ajax({
                url: $(this).attr("action"),
                type: "POST",
                data: $(this).serialize(),
                success: function() {
                    $('#addNewsModal').modal('hide');
                    location.reload(); // Reload trang
                },
                error: function(xhr) {
                    alert("Error: " + xhr.responseText);
                }
            });
        });
    });
</script>
</body>
</html>
