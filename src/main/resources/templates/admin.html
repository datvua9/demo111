<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>

<div th:insert="admin_navbar::admin_navbar"></div>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Danh sách Game</h2>
        <button class="btn btn-primary" data-toggle="modal" data-target="#addGameModal">Thêm mới Game</button>
    </div>
    <nav aria-label="Page navigation">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/admin(page=${currentPage - 1})}">Previous</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage ? 'active' : ''}">
                <a class="page-link" th:href="@{/admin(page=${i})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/admin(page=${currentPage + 1})}">Next</a>
            </li>
        </ul>
    </nav>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>STT</th>
            <th>Tên</th>
            <th class="description-col">Mô tả</th>
            <th>Thể loại</th>
            <th>Nền tảng</th>
            <th>Ngày ra mắt</th>
            <th>Nhà phát triển</th>
            <th>Ảnh</th>
            <th>Trạng thái</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="game, iterStat : ${games}">
            <td th:text="${iterStat.count + (currentPage * 4)}"></td>
            <td th:text="${game.name}"></td>
            <td>
                <div class="description-text" th:text="${game.description}"></div>
                <button class="read-more-btn" style="display: none;">Xem thêm</button>
            </td>
            <td th:text="${game.genre}"></td>
            <td th:text="${game.platform}"></td>
            <td th:text="${game.releaseDate}"></td>
            <td th:text="${game.developer}"></td>
            <td><img th:src="${game.image}" width="100" alt="Game Image" th:unless="${game.image == null}"/></td>
            <td th:text="${game.status == 1 ? 'Hoạt động' : 'Không hoạt động'}"></td>
            <td>
                <a th:href="@{/admin/edit/{id}(id=${game.gameId}, page=${currentPage})}" class="btn btn-sm btn-warning">Sửa</a>
                <form th:action="@{/admin/delete/{id}(id=${game.gameId})}" method="post" style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">Xóa</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Modal Thêm Game -->
<div class="modal fade" id="addGameModal" tabindex="-1" role="dialog" aria-labelledby="addGameModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addGameModalLabel">Thêm mới Game</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">×</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="addGameForm" th:action="@{/admin/add}" method="post" enctype="multipart/form-data">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="form-group">
                        <label for="gameName">Tên</label>
                        <input type="text" class="form-control" id="gameName" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="gameDescription">Mô tả</label>
                        <textarea class="form-control" id="gameDescription" name="description" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="gameCategory">Thể loại</label>
                        <input type="text" class="form-control" id="gameCategory" name="genre" required>
                    </div>
                    <div class="form-group">
                        <label for="gamePlatform">Nền tảng</label>
                        <input type="text" class="form-control" id="gamePlatform" name="platform" required>
                    </div>
                    <div class="form-group">
                        <label for="gameReleaseDate">Ngày ra mắt</label>
                        <input type="date" class="form-control" id="gameReleaseDate" name="releaseDate" required>
                    </div>
                    <div class="form-group">
                        <label for="gameDeveloper">Nhà phát triển</label>
                        <input type="text" class="form-control" id="gameDeveloper" name="developer" required>
                    </div>
                    <div class="form-group">
                        <label for="gameImage">Ảnh (PNG/JPG)</label>
                        <input type="file" class="form-control-file" id="gameImage" name="imageFile" accept=".png, .jpg, .jpeg" onchange="previewImage(event)" required>
                        <div id="imagePreview" style="display: none; margin-top: 10px;">
                            <p>Ảnh xem trước:</p>
                            <img id="previewImg" alt="Preview Image" style="max-width: 200px;">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="gameVideo">Video (URL)</label>
                        <input type="url" class="form-control" id="gameVideo" name="video">
                    </div>
                    <div class="form-group">
                        <label for="gameStatus">Trạng thái</label>
                        <select class="form-control" id="gameStatus" name="status">
                            <option value="1">Hoạt động</option>
                            <option value="0">Không hoạt động</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Lưu</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
    $(document).ready(function() {
        $("#addGameForm").on("submit", function(event) {
            event.preventDefault();
            let formData = new FormData(this);
            $.ajax({
                url: $(this).attr("action"),
                type: "POST",
                data: formData,
                processData: false,
                contentType: false,
                success: function() {
                    $('#addGameModal').modal('hide');
                    location.reload();
                },
                error: function(xhr) {
                    alert("Error: " + xhr.responseText);
                }
            });
        });
    });

    function previewImage(event) {
        const file = event.target.files[0];
        const previewContainer = document.getElementById('imagePreview');
        const previewImg = document.getElementById('previewImg');

        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                previewImg.src = e.target.result;
                previewContainer.style.display = 'block';
            };
            reader.readAsDataURL(file);
        } else {
            previewContainer.style.display = 'none';
        }
    }
</script>
</body>
</html>
