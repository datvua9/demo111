<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit Game</title>
  <link rel="stylesheet" th:href="@{/css/admin.css}">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
  <h2>Edit Game</h2>
  <form th:action="@{/admin/edit/{id}(id=${game.gameId}, page=${page})}" th:object="${game}" method="post" enctype="multipart/form-data">
    <input type="hidden" th:name="page" th:value="${page}"/>
    <input type="hidden" th:field="*{gameId}"/>

    <div class="form-group">
      <label for="gameName">Tên</label>
      <input type="text" class="form-control" id="gameName" th:field="*{name}" required>
    </div>
    <div class="form-group">
      <label for="gameDescription">Mô tả</label>
      <textarea class="form-control" id="gameDescription" th:field="*{description}" required></textarea>
    </div>
    <div class="form-group">
      <label for="gameCategory">Thể loại</label>
      <input type="text" class="form-control" id="gameCategory" th:field="*{genre}" required>
    </div>
    <div class="form-group">
      <label for="gamePlatform">Nền tảng</label>
      <input type="text" class="form-control" id="gamePlatform" th:field="*{platform}" required>
    </div>
    <div class="form-group">
      <label for="gameReleaseDate">Ngày ra mắt</label>
      <input type="date" class="form-control" id="gameReleaseDate" th:field="*{releaseDate}" required>
    </div>
    <div class="form-group">
      <label for="gameDeveloper">Nhà phát triển</label>
      <input type="text" class="form-control" id="gameDeveloper" th:field="*{developer}" required>
    </div>
    <div class="form-group">
      <label>Ảnh Game</label>
      <div class="mb-2">
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="imageSourceType" id="imageSourceUrl" value="url" checked>
          <label class="form-check-label" for="imageSourceUrl">Thêm bằng URL</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="imageSourceType" id="imageSourceFile" value="file">
          <label class="form-check-label" for="imageSourceFile">Thêm từ file</label>
        </div>
      </div>
      <div id="imageUrlInput">
        <input type="url" class="form-control" id="gameImageUrl" name="imageUrl" placeholder="Nhập URL ảnh">
      </div>
      <div id="imageFileInput" style="display: none;">
        <input type="file" class="form-control-file" id="gameImage" name="imageFile" accept=".png, .jpg, .jpeg" onchange="previewImage(event)">
      </div>
      <div th:if="${game.image}">
        <p>Ảnh hiện tại:</p>
        <img th:src="@{${game.image}}" alt="Current Image" style="max-width: 200px; margin-top: 10px;">
      </div>
      <div id="imagePreview" style="display: none; margin-top: 10px;">
        <p>Ảnh xem trước:</p>
        <img id="previewImg" alt="Preview Image" style="max-width: 200px;">
      </div>
    </div>
    <div class="form-group">
      <label for="gameVideo">Video (URL)</label>
      <input type="url" class="form-control" id="gameVideo" th:field="*{video}">
    </div>
    <div class="form-group">
      <label for="gameStatus">Trạng thái</label>
      <select class="form-control" id="gameStatus" th:field="*{status}">
        <option value="1">Hoạt động</option>
        <option value="0">Không hoạt động</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a th:href="@{/admin}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
  // Toggle between URL and file input based on radio button selection
  document.addEventListener('DOMContentLoaded', function() {
    const imageSourceUrl = document.getElementById('imageSourceUrl');
    const imageSourceFile = document.getElementById('imageSourceFile');
    const imageUrlInput = document.getElementById('imageUrlInput');
    const imageFileInput = document.getElementById('imageFileInput');
    const gameImageUrl = document.getElementById('gameImageUrl');
    const gameImage = document.getElementById('gameImage');

    // Set initial state based on current image
    if (document.querySelector('img[alt="Current Image"]')?.src?.startsWith('http')) {
      imageSourceUrl.checked = true;
      imageUrlInput.style.display = 'block';
      imageFileInput.style.display = 'none';
      if (gameImageUrl) {
        gameImageUrl.value = document.querySelector('img[alt="Current Image"]').src;
      }
    }

    // Add event listeners to radio buttons
    document.querySelectorAll('input[name="imageSourceType"]').forEach(function(radio) {
      radio.addEventListener('change', function() {
        if (this.value === 'url') {
          imageUrlInput.style.display = 'block';
          imageFileInput.style.display = 'none';
          gameImageUrl.required = true;
          gameImage.required = false;
        } else {
          imageUrlInput.style.display = 'none';
          imageFileInput.style.display = 'block';
          gameImageUrl.required = false;
          gameImage.required = true;
        }
      });
    });

    // Preview image from URL
    if (gameImageUrl) {
      gameImageUrl.addEventListener('input', function() {
        const url = this.value;
        const previewContainer = document.getElementById('imagePreview');
        const previewImg = document.getElementById('previewImg');

        if (url) {
          previewImg.src = url;
          previewContainer.style.display = 'block';
        } else {
          previewContainer.style.display = 'none';
        }
      });
    }
  });

  function previewImage(event) {
    const file = event.target.files[0];
    const previewContainer = document.getElementById('imagePreview');
    const previewImg = document.getElementById('previewImg');

    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        previewImg.src = e.target.result;
        previewContainer.style.display = 'block';
      };
      reader.readAsDataURL(file);
    } else {
      previewContainer.style.display = 'none';
    }
  }
</script>
</body>
</html>
