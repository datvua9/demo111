<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/gamelist.css}" />
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body>
<div th:replace="navbar::navbar"></div>

<div class="content">
    <div th:replace="game_navbar::game_navbar"></div>

    <div id="game-list-app" class="games-container-2">
        <!-- Top pagination -->
        <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center">
                <li class="page-item" :class="{ 'disabled': currentPage === 0 }">
                    <a class="page-link" @click.prevent="goToPage(currentPage - 1)"
                       :href="getPageUrl(currentPage - 1)"
                       :style="{ cursor: currentPage === 0 ? 'not-allowed' : 'pointer' }">Previous</a>
                </li>
                <li class="page-item" v-for="i in totalPages" :key="i-1"
                    :class="{ 'active': i-1 === currentPage }">
                    <a class="page-link" @click.prevent="goToPage(i-1)"
                       :href="getPageUrl(i-1)">{{ i }}</a>
                </li>
                <li class="page-item" :class="{ 'disabled': currentPage === totalPages - 1 }">
                    <a class="page-link" @click.prevent="goToPage(currentPage + 1)"
                       :href="getPageUrl(currentPage + 1)"
                       :style="{ cursor: currentPage === totalPages - 1 ? 'not-allowed' : 'pointer' }">Next</a>
                </li>
            </ul>
        </nav>

        <div class="games-list-2">
            <div v-for="game in games" :key="game.gameId">
                <div class="game-card-2 h-100">
                    <a :href="'/game/' + game.gameId">
                        <img :src="game.image" :alt="game.name" class="img-fluid">
                    </a>
                    <div class="games-info-2">
                        <h3 class="game-title-2">{{ game.name }}</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom pagination -->
        <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center">
                <li class="page-item" :class="{ 'disabled': currentPage === 0 }">
                    <a class="page-link" @click.prevent="goToPage(currentPage - 1)"
                       :href="getPageUrl(currentPage - 1)"
                       :style="{ cursor: currentPage === 0 ? 'not-allowed' : 'pointer' }">Previous</a>
                </li>
                <li class="page-item" v-for="i in totalPages" :key="i-1"
                    :class="{ 'active': i-1 === currentPage }">
                    <a class="page-link" @click.prevent="goToPage(i-1)"
                       :href="getPageUrl(i-1)">{{ i }}</a>
                </li>
                <li class="page-item" :class="{ 'disabled': currentPage === totalPages - 1 }">
                    <a class="page-link" @click.prevent="goToPage(currentPage + 1)"
                       :href="getPageUrl(currentPage + 1)"
                       :style="{ cursor: currentPage === totalPages - 1 ? 'not-allowed' : 'pointer' }">Next</a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        const games = /*[[${Games}]]*/ [];
        const currentPage = /*[[${currentPage}]]*/ 0;
        const totalPages = /*[[${totalPages}]]*/ 1;
        const selectedCategory = /*[[${selectedCategory}]]*/ '';
        const selectedYear = /*[[${selectedYear}]]*/ '';
        const selectedPlatform = /*[[${selectedPlatform}]]*/ '';

        new Vue({
            el: '#game-list-app',
            data: {
                games: games,
                currentPage: currentPage,
                totalPages: totalPages,
                filters: {
                    category: selectedCategory,
                    year: selectedYear,
                    platform: selectedPlatform
                }
            },
            methods: {
                goToPage: function(page) {
                    if (page < 0 || page >= this.totalPages) {
                        return;
                    }

                    window.location.href = this.getPageUrl(page);
                },
                getPageUrl: function(page) {
                    let url = '/game_list?page=' + page;

                    if (this.filters.category) {
                        url += '&category=' + this.filters.category;
                    }

                    if (this.filters.year) {
                        url += '&year=' + this.filters.year;
                    }

                    if (this.filters.platform) {
                        url += '&platform=' + this.filters.platform;
                    }

                    return url;
                }
            }
        });
    });
</script>
</body>
</html>
